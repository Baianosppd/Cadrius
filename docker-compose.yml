version: '3.8'

networks:
  proxy_net:
    name: proxy_net
  backend_net:
    name: backend_net

services:
  # --- 1. PROXY REVERSO ---
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true" 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" 
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy_net

  # --- 2. BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cadrius
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    env_file:
      - .env
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadrius"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3. BACKUP ---
  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=cadrius
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_CLUSTER=TRUE
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - backend_net

  # --- 4. REDIS ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 5. APLICAÇÃO WEB (DJANGO) ---
# --- 5. APLICAÇÃO WEB (DJANGO) ---
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             DJANGO_SUPERUSER_USERNAME=admin 
             DJANGO_SUPERUSER_EMAIL=admin@cadrius.com 
             DJANGO_SUPERUSER_PASSWORD=admin123 
             python manage.py createsuperuser --noinput || true &&
             python manage.py collectstatic --noinput &&
             uvicorn cadrius.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy_net
      - backend_net
    labels:
      - "traefik.enable=true"
      # Pode manter apenas o localhost ou adicionar o vosso ngrok se desejar: Host(`localhost`) || Host(`nonvinous-debbie-unrelated.ngrok-free.dev`)
      - "traefik.http.routers.cadrius-web.rule=Host(`localhost`)"
      - "traefik.http.services.cadrius-web.loadbalancer.server.port=8000"
      
      # ANTI-DDOS (RATE LIMITING)
      # 1. Define o limite: média de 50 requisições por segundo, tolerando um pico (burst) momentâneo de 100
      - "traefik.http.middlewares.rate-limit-cadrius.ratelimit.average=50"
      - "traefik.http.middlewares.rate-limit-cadrius.ratelimit.burst=100"
      
      # 2. Aplica o middleware de limite à rota principal da aplicação web
      - "traefik.http.routers.cadrius-web.middlewares=rate-limit-cadrius"

  # --- 6. WORKER ---
  worker:
    build: .
    restart: always
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net

  # --- 7. DOZZLE (LOGS) ---
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "8888:8080"
    networks:
      - proxy_net

  # --- 8. TÚNEL REVERSO (Acesso externo para Webhooks) ---
  ngrok:
      image: ngrok/ngrok:latest
      restart: unless-stopped
      ports:                  
        - "4040:4040"         
      command:
        - "http"
        - "http://traefik:80"
      env_file:
        - .env
      networks:
        - proxy_net
      depends_on:
        - traefik

  # --- 9. EVOLUTION API (WHATSAPP) ---
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: cadrius_evolution
    user: "root"  
    ports:
      - "8082:8080"
    environment:
      - SERVER_URL=http://localhost:8082
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=cadrius_mestre_secreto_123 
      
      # --- CONEXÃO COM O BANCO DE DADOS (POSTGRES) ---
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@db:5432/cadrius?schema=public

      - CACHE_REDIS_ENABLED=false
      
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - proxy_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  evolution_instances: