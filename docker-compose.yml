version: '3.8'

# Rotação dos logs JSON do Docker (CAD-058): evita que web/worker/db encham o disco.
# Máx. 10 MB x 5 ficheiros = ~50 MB por contentor. Também limita o histórico visível no Dozzle.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

networks:
  proxy_net:
    name: proxy_net
  backend_net:
    name: backend_net

services:
  # --- 1. PROXY REVERSO ---
  traefik:
      image: traefik:v2.10
      container_name: cadrius_traefik
      command:
        # Painel do Traefik sem autenticação: só em dev (em produção TRAEFIK_API_INSECURE=false).
        - "--api.insecure=${TRAEFIK_API_INSECURE:-true}"
        - "--providers.docker=true"
        - "--providers.docker.exposedbydefault=false"
        - "--entrypoints.web.address=:80"
      ports:
        - "80:80"
        # Portas internas/administrativas só em loopback: nunca expostas à internet.
        - "127.0.0.1:8090:8080"
      volumes:
        # Ajustado para WSL2 Moderno
        - "//var/run/docker.sock:/var/run/docker.sock:ro"
      restart: unless-stopped
      networks:
        - proxy_net

  # --- 2. BANCO DE DADOS ---
  db:
    logging: *default-logging
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cadrius
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    env_file:
      - .env
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadrius"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3. BACKUP ---
  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=cadrius
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_CLUSTER=TRUE
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - backend_net

  # --- 4. REDIS ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 5. APLICAÇÃO WEB (DJANGO) ---
  web:
      logging: *default-logging
      build: .
      restart: always
      command: >
        sh -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               uvicorn cadrius.asgi:application --host 0.0.0.0 --port 8000 ${UVICORN_ARGS---reload}"
      
      # Bypass de desenvolvimento, agora só em loopback (em produção o acesso é via Traefik).
      # Em produção defina UVICORN_ARGS= (vazio) no .env para desligar o --reload.
      ports:
        - "127.0.0.1:8000:8000"
      
      volumes:
        - .:/app
      env_file:
        - .env
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - proxy_net
        - backend_net
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy_net"
        # Limite ~2MB por payload (JSON/webhooks). Nginx equivalente: client_max_body_size 2m;
        - "traefik.http.middlewares.cadrius-body-limit.buffering.maxRequestBodyBytes=2097152"
        - "traefik.http.middlewares.cadrius-body-limit.buffering.memRequestBodyBytes=2097152"
        - "traefik.http.routers.cadrius-web.rule=Host(`127.0.0.1`)"
        - "traefik.http.routers.cadrius-web.entrypoints=web"
        - "traefik.http.routers.cadrius-web.middlewares=cadrius-body-limit"
        - "traefik.http.services.cadrius-web.loadbalancer.server.port=8000"

  # --- 6. WORKER ---
  worker:
    logging: *default-logging
    build: .
    restart: always
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net

  # --- 7. DOZZLE (LOGS) ---
  # Sem porta publicada no host: o acesso é só via Traefik, protegido por BasicAuth (CAD-057).
  # Variáveis no .env (na raiz do projeto, lido pelo Compose):
  #   DOZZLE_HOST=logs.seudominio.com
  #   DOZZLE_BASIC_AUTH='admin:$apr1$...'   (gerar com: htpasswd -nb admin <senha>)
  # Use aspas simples no .env para o `$` do hash não ser interpolado.
  # Sem DOZZLE_BASIC_AUTH o middleware fica inválido e o Traefik não publica o router
  # (falha fechada: nunca há acesso sem autenticação nem credencial padrão).
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOST:-logs.localhost}`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.routers.dozzle.middlewares=dozzle-auth"
      - "traefik.http.middlewares.dozzle-auth.basicauth.users=${DOZZLE_BASIC_AUTH:-}"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # --- 8. TÚNEL REVERSO (Acesso externo para Webhooks) ---
  ngrok:
      image: ngrok/ngrok:latest
      restart: unless-stopped
      ports:                  
        - "127.0.0.1:4040:4040"         
      command:
        - "http"
        - "http://traefik:80"
      env_file:
        - .env
      networks:
        - proxy_net
      depends_on:
        - traefik

  # --- 9. EVOLUTION API (WHATSAPP) ---
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: cadrius_evolution
    user: "root"  
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - SERVER_URL=http://localhost:8082
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_GLOBAL_KEY:-cadrius_mestre_secreto_123}
      
      # --- CONEXÃO COM O BANCO DE DADOS (POSTGRES) ---
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/cadrius?schema=public

      - CACHE_REDIS_ENABLED=false
      
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - proxy_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  evolution_instances: