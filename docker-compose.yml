version: '3.8'

# --- DEFINIÇÃO DE REDES ISOLADAS ---
networks:
  proxy_net:
    name: proxy_net
  backend_net:
    name: backend_net

services:
  # --- 1. PROXY REVERSO (Única porta de entrada) ---
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true" # Ativa o dashboard local (remover em produção real)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false" # Só expõe quem tiver label 'traefik.enable=true'
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"       # Porta HTTP padrão para a API
      - "8080:8080"   # Dashboard do Traefik (para debug local)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy_net

  # --- 2. BANCO DE DADOS (Totalmente Isolado e Seguro) ---
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env # Senhas injetadas dinamicamente
    networks:
      - backend_net

  # --- 3. BACKUP AUTOMÁTICO DO BANCO DE DADOS ---
  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_CLUSTER=TRUE
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=3
    networks:
      - backend_net

  # --- 4. REDIS (Fila e Cache) ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - backend_net

  # --- 5. APLICAÇÃO WEB (Backend / API Assíncrona) ---
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py collectstatic --noinput &&
             uvicorn cadrius.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - proxy_net   # Expõe para o Traefik
      - backend_net # Acede ao banco e ao redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cadrius-web.rule=Host(`localhost`)" 
      - "traefik.http.routers.cadrius-web.entrypoints=web"
      - "traefik.http.services.cadrius-web.loadbalancer.server.port=8000"

  # --- 6. WORKER (Robôs de Background do Django-Q) ---
  worker:
    build: .
    restart: always
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend_net # Totalmente isolado da rede externa

  # --- 7. OBSERVABILIDADE DE LOGS EM TEMPO REAL ---
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.localhost`)" 
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

volumes:
  postgres_data: