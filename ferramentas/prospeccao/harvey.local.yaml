# Configuração do Harvey para o Cadrius (CAD-238). Copie para a pasta do Harvey como harvey.local.yaml:
# esse arquivo vence o harvey.yaml e fica fora do git do Harvey.
# Preencha os campos marcados com TROCAR antes de rodar.

persona:
  name: "Jullio"                        # TROCAR se outra pessoa assinar os e-mails
  company: "Cadrius"
  role: "Fundador"
  email: "jullio@TROCAR-DOMINIO.com.br" # caixa do domínio SEPARADO de prospecção (nunca @cadrius.ia.br)
  linkedin: ""
  tone: "direto, cordial e respeitoso, de colega para colega; português do Brasil, sem jargão de vendas"

product:
  name: "Cadrius"
  description: >-
    Plataforma de gestão jurídica com IA para advogados autônomos e escritórios pequenos e médios.
    Traz as publicações do DJEN da OAB do advogado todo dia, conta os prazos em dias úteis (feriados e
    suspensões dos tribunais), lê documentos com IA (o advogado revisa antes de usar), automatiza
    lembretes e mensagens a clientes por WhatsApp e e-mail, e mantém clientes, honorários e portal do
    cliente num lugar só. Dados cifrados e trilha de auditoria (LGPD).
  pricing: "Teste grátis de 14 dias; planos a partir de R$ 99/mês (Start), R$ 299/mês (Pro, até 5 usuários)"
  key_benefits:
    - "Publicações do DJEN e prazos em dias úteis sem abrir diário oficial"
    - "Leitura de documentos e minutas com IA, sempre com revisão do advogado"
    - "Lembretes e mensagens automáticas aos clientes (WhatsApp e e-mail) com autorização registrada"
    - "Clientes, honorários e portal do cliente num lugar só, com dados cifrados (LGPD)"
  objection_responses:
    "too expensive": "Entendo. O Start custa R$ 99/mês e o teste de 14 dias é grátis, sem cartão: dá para medir quanto tempo economiza antes de decidir."
    "already have a solution": "Faz sentido. O que você gostaria que o seu sistema atual fizesse melhor: prazos, publicações ou atendimento ao cliente?"
    "not interested": "Sem problema, obrigado pela resposta. Não envio mais."
    "segurança dos dados": "Os dados ficam cifrados, com trilha de auditoria e segundo fator de login; a política de privacidade está em https://app.cadrius.ia.br/politica-de-privacidade"
  offer:
    primary: "Assinatura mensal a partir de R$ 99"
    entry: "Teste grátis de 14 dias, sem cartão"
    goal: "start_trial"
    booking_method: "ask_preference"
    booking_url: "https://app.cadrius.ia.br/criar-conta"
    meeting_duration: "15 minutos"
    meeting_owner: "Jullio"

