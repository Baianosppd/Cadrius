channels:
  email:
    enabled: true
    provider: "gmail"           # Google Workspace no domínio de prospecção
    max_daily_sends: 30         # teto depois do aquecimento; suba devagar
    require_approval: true      # NADA sai sem você aprovar no Outbox
    send_to_risky: false
    max_bounce_rate: 0.03       # pausa tudo se passar de 3% de devolução
    warmup:
      start_date: ""            # TROCAR: dia em que o aquecimento da caixa começou (AAAA-MM-DD)
      min_days: 21
      start_sends: 5
      daily_increase: 2
    send_window:
      start: "09:00"
      end: "17:00"
      weekdays_only: true
      recipient_timezone: false # todos no horário de Brasília
    signature:
      logo: ""                  # texto puro entrega melhor no começo
  linkedin:
    enabled: false

usage:
  max_daily_claude_percent: 60
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "20:00"
    end: "08:00"
    timezone: "America/Sao_Paulo"

compliance:
  postal_address: "TROCAR: endereço comercial do Cadrius (aparece no rodapé)"
  opt_out_line: 'Se não fizer sentido para você, responda "não, obrigado" e eu não envio mais.'
  do_not_contact:
    - "cadrius.ia.br"
    # TROCAR/ADICIONAR: domínios de clientes atuais, parceiros e concorrentes
  precleared:
    enabled: false              # o serviço cobre UK/EUA/Canadá/Alemanha/França, não o Brasil

writer:
  email_rules: "skills/email_rules.md"
