name: Deploy de teste (staging)

# Todo push na branch develop publica o ambiente de TESTE (app-teste / api-teste). Base separada e sintética.
on:
  push:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy em staging
    runs-on: ubuntu-latest
    needs: [ci]
    environment: staging
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          for v in VPS_HOST VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v não configurado"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          # tr -d '\r': chaves geradas/coladas no Windows vêm com CRLF e o ssh recusa ("error in libcrypto")
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 || { echo "::error::VPS_SSH_KEY inválida: cole a chave PRIVADA completa (de BEGIN até END)"; exit 1; }
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo /opt/cadrius/infra/deploy/scripts/deploy.sh staging $SHA"
