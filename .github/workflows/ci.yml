name: CI (qualidade, segurança e testes)

# Reutilizado pelo deploy.yml (workflow_call): o deploy só corre se TUDO aqui passar.
on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sast-deps:
    name: Lint, SAST e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Ferramentas
        run: pip install flake8 bandit pip-audit
      - name: Flake8 (erros de sintaxe e pyflakes — RNF-014)
        run: flake8 . --select=E9,F --exclude='*/migrations/*,venv,env,.venv' --show-source --statistics
      - name: Bandit (SAST, severidade média+)
        run: bandit -q -r . -x ./venv,./.venv,./scripts,'*/tests*,*/tests/*' --severity-level medium
      - name: pip-audit (CVEs nas dependências pinadas)
        run: pip-audit -r requirements.txt --require-hashes

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    # Não bloqueante até o histórico antigo ser saneado (senhas já commitadas). Depois: remover.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --verbose

  tests:
    name: Testes Django (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cadrius_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:password123@localhost:5432/cadrius_test
      REDIS_URL: redis://localhost:6379/1
      OPENAI_API_KEY: sk-ci-fake
      GROQ_API_KEY: gsk-ci-fake
      GEMINI_API_KEY: gemini-ci-fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências (hashes obrigatórios)
        run: pip install --require-hashes -r requirements.txt
      - name: Integridade das migrações (RNF-015)
        run: python manage.py makemigrations --check --dry-run
      - name: Django check
        run: python manage.py check
      - name: Django check --deploy (produção simulada)
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-1234567890
          ENCRYPTION_KEY: Zm9yLWNpLW9ubHktbm90LWEtcmVhbC1rZXktMTIzNDU2Nzg=
          EVOLUTION_API_KEY: ci-only
        run: python manage.py check --deploy
      - name: Migrar e testar (com cobertura mínima de 75%)
        run: |
          pip install coverage
          python manage.py migrate --noinput
          coverage run --source=. --omit='*/tests*,*/migrations/*,scripts/*,manage.py,*/tests/*' manage.py test --verbosity 1
          coverage report --skip-empty --fail-under=75

  docker:
    name: Imagem Docker, compose e scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint-sast-deps]
    steps:
      - uses: actions/checkout@v7
      - name: Validar compose (dev e produção)
        run: |
          touch .env
          docker compose config -q
          APP_HOST=x.example ACME_EMAIL=a@example.com POSTGRES_PASSWORD=p REDIS_PASSWORD=p \
            EVOLUTION_API_GLOBAL_KEY=k DOZZLE_HOST=l.example DOZZLE_BASIC_AUTH=u:p \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build da imagem
        run: docker build -t cadrius-app:ci .
      - name: Imagem não corre como root
        run: test "$(docker run --rm --entrypoint id cadrius-app:ci -u)" != "0"
      - name: Trivy (CVEs CRITICAL/HIGH com correção disponível)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cadrius-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
