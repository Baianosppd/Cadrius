name: Deploy Automático Locaweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy e Injeção de Segredos
    runs-on: ubuntu-latest

    steps:
      - name: Executando Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOCAWEB_HOST }}
          username: ${{ secrets.LOCAWEB_USER }}
          key: ${{ secrets.LOCAWEB_SSH_KEY }}
          script: |
            cd /opt/cadrius
            git stash
            git pull origin main
            
            # === INÍCIO DA INJEÇÃO DO VAULT ===
            echo "Gerando .env dinâmico de Produção..."
            echo "DEBUG=False" > .env
            echo "ENVIRONMENT=production" >> .env
            echo "ALLOWED_HOSTS=api.cadrius.ia.br,app.cadrius.ia.br,wpp.cadrius.ia.br,127.0.0.1,localhost" >> .env
            echo "CORS_ALLOWED_ORIGINS=https://app.cadrius.ia.br" >> .env
            echo "CSRF_TRUSTED_ORIGINS=https://app.cadrius.ia.br,https://api.cadrius.ia.br" >> .env
            echo "SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https" >> .env
            
            # Banco e Redis
            echo "POSTGRES_DB=cadrius" >> .env
            echo "POSTGRES_USER=postgres" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}" >> .env
            echo "DATABASE_URL=postgres://postgres:${{ secrets.PROD_POSTGRES_PASSWORD }}@db:5432/cadrius" >> .env
            echo "REDIS_URL=redis://redis:6379/1" >> .env
            
            # Segredos Injetados do GitHub
            echo "DJANGO_SECRET_KEY='${{ secrets.PROD_DJANGO_SECRET_KEY }}'" >> .env
            echo "OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}" >> .env
            echo "EVOLUTION_API_KEY=${{ secrets.PROD_EVOLUTION_API_KEY }}" >> .env
            
            # Configurações Estáticas (IMAP, Trello, etc - podem ir pro Vault no futuro)
            echo "IMAP_HOST=imap.gmail.com" >> .env
            echo "IMAP_PORT=993" >> .env
            echo "IMAP_USERNAME=testejuri6@gmail.com" >> .env
            echo "IMAP_PASSWORD=smlm gtga zldb gijp" >> .env
            
            # Protege o ficheiro gerado
            chmod 600 .env
            # === FIM DA INJEÇÃO DO VAULT ===
            
            sudo docker compose up -d --build