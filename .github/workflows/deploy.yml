name: Deploy de produção

# Servidor: VPS Locaweb. O kit está em deploy/ (ver deploy/README.md). Os segredos da aplicação ficam
# SOMENTE no servidor (/opt/cadrius/prod/.env) — o GitHub guarda apenas o acesso SSH ao usuário 'deploy'.
on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A MURALHA: lint + SAST + CVEs + testes + imagem têm de passar antes de qualquer deploy.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy com backup pré-deploy, validação e rollback
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production   # configure "Required reviewers" no GitHub para exigir aprovação manual
    steps:
      - name: Validar segredos de acesso
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v não configurado"; exit 1; }
          done

      - name: Deploy via SSH (host verificado, sem confiar no primeiro uso)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          # tr -d '\r': chaves geradas/coladas no Windows vêm com CRLF e o ssh recusa ("error in libcrypto")
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 || { echo "::error::VPS_SSH_KEY inválida: cole a chave PRIVADA completa (de BEGIN até END)"; exit 1; }
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo /opt/cadrius/infra/deploy/scripts/deploy.sh prod $SHA"
