name: Deploy de produção

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A MURALHA: lint + SAST + CVEs + testes + imagem têm de passar antes de qualquer deploy.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy com validação e rollback
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production
    steps:
      - name: Validar segredos obrigatórios
        env:
          PROD_DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
          PROD_ENCRYPTION_KEY: ${{ secrets.PROD_ENCRYPTION_KEY }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          PROD_EVOLUTION_API_KEY: ${{ secrets.PROD_EVOLUTION_API_KEY }}
          PROD_DOZZLE_BASIC_AUTH: ${{ secrets.PROD_DOZZLE_BASIC_AUTH }}
          PROD_ACME_EMAIL: ${{ secrets.PROD_ACME_EMAIL }}
        run: |
          fail=0
          for v in PROD_DJANGO_SECRET_KEY PROD_ENCRYPTION_KEY PROD_POSTGRES_PASSWORD PROD_REDIS_PASSWORD \
                   PROD_EVOLUTION_API_KEY PROD_DOZZLE_BASIC_AUTH PROD_ACME_EMAIL; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado"; fail=1; fi
          done
          exit $fail

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOCAWEB_HOST }}
          username: ${{ secrets.LOCAWEB_USER }}
          key: ${{ secrets.LOCAWEB_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/cadrius

            # Dumps antigos podem estar versionados (removidos do git neste release): copia antes do pull.
            if [ -d backups ]; then cp -a backups "../cadrius-backups-$(date +%Y%m%d%H%M%S)"; fi

            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            umask 077
            {
              echo "DEBUG=False"
              echo "DJANGO_ENV=production"
              echo "APP_VERSION=${{ github.sha }}"
              echo "APP_HOST=api.cadrius.ia.br"
              echo "ALLOWED_HOSTS=api.cadrius.ia.br,app.cadrius.ia.br,wpp.cadrius.ia.br,127.0.0.1,localhost"
              echo "CORS_ALLOWED_ORIGINS=https://app.cadrius.ia.br"
              echo "CSRF_TRUSTED_ORIGINS=https://app.cadrius.ia.br,https://api.cadrius.ia.br"
              echo "AXES_PROXY_COUNT=1"
              echo "POSTGRES_DB=cadrius"
              echo "POSTGRES_USER=postgres"
              echo "POSTGRES_PASSWORD='${{ secrets.PROD_POSTGRES_PASSWORD }}'"
              echo "DATABASE_URL=postgres://postgres:${{ secrets.PROD_POSTGRES_PASSWORD }}@db:5432/cadrius"
              echo "REDIS_PASSWORD='${{ secrets.PROD_REDIS_PASSWORD }}'"
              echo "REDIS_URL=redis://:${{ secrets.PROD_REDIS_PASSWORD }}@redis:6379/1"
              echo "DJANGO_SECRET_KEY='${{ secrets.PROD_DJANGO_SECRET_KEY }}'"
              echo "ENCRYPTION_KEY='${{ secrets.PROD_ENCRYPTION_KEY }}'"
              echo "EVOLUTION_API_GLOBAL_KEY='${{ secrets.PROD_EVOLUTION_API_KEY }}'"
              echo "EVOLUTION_SERVER_URL=https://wpp.cadrius.ia.br"
              echo "OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}"
              echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}"
              echo "STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}"
              echo "ACME_EMAIL=${{ secrets.PROD_ACME_EMAIL }}"
              echo "DOZZLE_HOST=logs.cadrius.ia.br"
              echo "DOZZLE_BASIC_AUTH='${{ secrets.PROD_DOZZLE_BASIC_AUTH }}'"
              echo "IMAP_HOST=${{ secrets.PROD_IMAP_HOST }}"
              echo "IMAP_PORT=993"
              echo "IMAP_USERNAME=${{ secrets.PROD_IMAP_USERNAME }}"
              echo "IMAP_PASSWORD='${{ secrets.PROD_IMAP_PASSWORD }}'"
            } > .env
            chmod 600 .env

            $COMPOSE up -d --build --remove-orphans

            # Smoke test: readiness (banco + cache). Falhou -> rollback para o commit anterior.
            for i in $(seq 1 18); do
              if curl -fsS -H "Host: api.cadrius.ia.br" http://127.0.0.1/readyz/ >/dev/null 2>&1 \
                 || curl -fsSk https://api.cadrius.ia.br/readyz/ >/dev/null 2>&1; then
                echo "Deploy saudável."; exit 0
              fi
              sleep 10
            done
            echo "::error::Readiness falhou após o deploy — rollback para $PREV"
            git reset --hard "$PREV"
            $COMPOSE up -d --build --remove-orphans
            exit 1
